name: Update site
# Runs by itself every 30 minutes, when an article is added, or when someone clicks "Run workflow" (Actions tab).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["posts/**", "build.py", "update.py", "images.py"]
concurrency: update-site
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown
      - run: python update.py
        env: { YT_API_KEY: "${{ secrets.YT_API_KEY }}" }
      - run: python images.py
        continue-on-error: true   # Amazon sometimes blocks image lookups; cached photos are kept
      - run: python build.py
      - name: Commit and publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "Ankushali Vlogs bot"
          git config user.email "ankushalivlogs@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-update site"
          for i in 1 2 3; do  # someone else may have pushed meanwhile: rebase on top (our fresh files win) and retry
            git pull --rebase -X theirs -q && git push && break
            sleep 5
          done
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
